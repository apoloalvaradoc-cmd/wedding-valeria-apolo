# Netlify sirve el repo tal cual: son archivos estáticos, sin build.
[build]
  publish = "."
  command = ""

# La invitación se comparte con ?i=TOKEN, que Netlify entrega igual.
# Estas cabeceras son solo higiene: nada de esto es secreto, pero evita
# que el sitio se pueda incrustar en otra página.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# La consola de envío no debe salir en buscadores.
[[headers]]
  for = "/consola.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
