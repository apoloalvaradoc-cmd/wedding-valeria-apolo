<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mesas · Consola · Valeria &amp; Apolo</title>
<link rel="stylesheet" href="consola.css">
</head>
<body>

<div id="app" class="hidden">
  <div class="wrap">
    <div class="stats" id="stats"></div>

    <!-- Solo aparece al tocar una mesa. -->
    <div class="card hidden" id="editor" style="margin-top:1rem">
      <h2>Mesa <span id="ed-num"></span></h2>
      <div class="editor-mesa">
        <div class="row">
          <input type="text" id="ed-nombre" placeholder="Nombre de la mesa (opcional)">
          <input type="number" id="ed-cap" min="1" max="24" title="Lugares">
          <select id="ed-forma" title="Forma" style="width:auto">
            <option value="redonda">Redonda</option>
            <option value="rect_h">Rectangular acostada</option>
            <option value="rect_v">Rectangular parada</option>
          </select>
          <button class="small filled" id="ed-guardar">Guardar</button>
        </div>
        <ul class="lugares" id="ed-lugares"></ul>
        <div class="row">
          <input type="text" id="ed-apartar-nombre" maxlength="80"
                 placeholder="Apartar un lugar para… (nombre)">
          <button class="small" id="ed-apartar">Apartar lugar</button>
        </div>
        <div class="row">
          <span class="muted" style="font-size:0.84rem">Pasar mesa completa a</span>
          <select id="ed-destino" style="width:auto"></select>
          <button class="small" id="ed-pasar">Pasar</button>
        </div>
        <div class="row">
          <button class="small" id="ed-vaciar">Vaciar</button>
          <button class="small" id="ed-borrar">Eliminar mesa</button>
          <button class="small" id="ed-cerrar">Cerrar</button>
        </div>
      </div>
    </div>

    <div class="mesas-layout" style="margin-top:1rem">
      <div class="card pool" id="pool">
        <h2>Sin lugar <span class="muted" id="pool-cuenta"></span></h2>
        <p class="hint">
          Arrastra a una persona —o al nombre de la invitación, para sentarlos
          a todos— hasta una mesa. En el teléfono: tócala y luego toca la mesa.
        </p>
        <div class="row" style="margin-bottom:0.5rem">
          <input type="text" id="q" placeholder="Buscar...">
        </div>
        <label class="row" style="text-transform:none;letter-spacing:0;font-size:0.8rem;margin-bottom:0.6rem">
          <input type="checkbox" id="solo-conf" style="width:auto;margin-right:0.4rem">
          Solo los que ya confirmaron
        </label>
        <div id="pool-lista"></div>
      </div>

      <div class="card" style="padding:0.6rem">
        <div class="row" style="padding:0.2rem 0.4rem 0.6rem">
          <select id="nueva-forma" style="width:auto" title="Forma de la mesa nueva">
            <option value="redonda">Redonda</option>
            <option value="rect_h">Rectangular acostada</option>
            <option value="rect_v">Rectangular parada</option>
          </select>
          <button class="small filled" id="btn-mesa">+ Agregar mesa</button>
          <button class="small" id="btn-auto"
                  title="Sienta por tipo de invitado a quienes todavía no tienen lugar. No mueve a nadie que ya esté sentado.">Autoacomodar</button>
          <span class="muted" id="salon-info"></span>
          <span class="zoom">
            <button class="small" id="zoom-menos" title="Alejar">−</button>
            <button class="small" id="zoom-ajustar" title="Ver el salón completo">Ajustar</button>
            <button class="small" id="zoom-mas" title="Acercar">+</button>
          </span>
        </div>
        <div class="leyenda" style="padding:0 0.4rem 0.6rem">
          <span><span class="asiento"></span>Confirmado</span>
          <span><span class="asiento sin-confirmar"></span>Sin confirmar</span>
          <span><span class="asiento con-restriccion"></span>Con restricción</span>
          <span><span class="asiento apartado"></span>Apartado (pendiente)</span>
        </div>
        <div class="lienzo" id="lienzo">
          <div class="salon-marco" id="marco">
            <div class="salon" id="salon"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="barra-sel hidden" id="barra">
    <span id="barra-texto"></span>
    <div class="row">
      <button class="small" id="btn-quitar">Quitar de la mesa</button>
      <button class="small" id="btn-cancelar">Cancelar</button>
    </div>
  </div>
</div>

<!-- Solo se ve al imprimir: el plano del salón y la lista por mesa. -->
<div id="imprimir"></div>

<script src="consola-base.js"></script>
<script src="xlsx.js"></script>
<script>
/* ============================================================
   Mesas · croquis del salón

   El salón es el del plano (LayoutValeriaApolo.pdf): mesas redondas
   y rectangulares en su lugar, más la tarima, la mesa larga, la
   pista, el bar y el pastel, que no se mueven. Por dentro mide
   siempre lo mismo y se escala entero con el zoom.

   Se sienta POR PERSONA, no por invitación. Es lo que permite
   partir a una familia de seis en dos mesas, que es justo lo que
   siempre termina pasando. A quien todavía no confirma se le
   reserva el lugar igual, con el nombre que ya conocemos.

   Apartados: lugares guardados con un nombre que todavía no se
   sabe a qué invitación corresponde. Ocupan lugar como cualquiera.

   Dos formas de mover gente, porque esto se usa tanto en la
   computadora como en el teléfono:
     · arrastrar y soltar
     · tocar a la persona y luego tocar la mesa
============================================================ */

const SALON_W = 1600;
const SALON_H = 1126;

/* Lo fijo, en fracción del salón, medido sobre el PDF. El texto de cada
   uno se cambia tocándolo y se guarda en la base (etiquetas); txt es solo
   el que se usa mientras no haya otro guardado. La larga frente a la
   tarima va sin nombre: todavía no se sabe si va a ser mesa. */
const ELEMENTOS = [
  { cls: 'tarima', txt: 'Tarima', x: 0.4428, y: 0.0385, w: 0.1162, h: 0.1162 },
  { cls: 'larga',  txt: '',       x: 0.2390, y: 0.1808, w: 0.5221, h: 0.0506 },
  { cls: 'pista',  txt: 'Pista',  x: 0.3599, y: 0.2314, w: 0.2820, h: 0.2818 },
  { cls: 'bar',    txt: 'Bar',    x: 0.4428, y: 0.5580, w: 0.1162, h: 0.1162 },
  { cls: 'pastel', txt: 'Pastel', x: 0.4677, y: 0.7395, w: 0.0759, h: 0.0759 * SALON_W / SALON_H },
];
let etiquetas = {};     // texto guardado de cada elemento fijo, por cls
const textoDe = e => (e.cls in etiquetas ? etiquetas[e.cls] : e.txt);

let mesas = [];
let invitados = [];
let asientos = [];
let apartados = [];

let personas = [];      // todas las personas, aplanadas
let sentados = new Map();   // "INV001#0" → id de mesa

// Lo que está elegido y espera una mesa: "p|INV001|0", "g|INV001" o "a|12".
let sel = null;
let editando = null;    // id de la mesa abierta en el panel
let zoom = null;        // null = ajustado al ancho del lienzo

const K = (inv, idx) => inv + '#' + idx;

/* Iniciales para la ficha del lugar: en 26px no cabe más. Sin el "Sr." ni
   los "de", que no distinguen a nadie. */
function iniciales(nombre) {
  const p = String(nombre || '')
    .replace(/^(sr|sra|srta|dr|dra|lic|licda|ing)\.?\s+/i, '')
    .trim().split(/\s+/)
    .filter(w => w && !/^(de|del|la|las|los|y|&)$/i.test(w));
  if (!p.length) return '?';
  return (p[0][0] + (p[1] ? p[1][0] : '')).toUpperCase();
}

function recalcular() {
  personas = [];
  invitados.forEach(inv => personasDe(inv).forEach(p => personas.push({
    invitado_id: inv.id,
    idx: p.idx,
    nombre: p.nombre,
    restriccion: p.restriccion,
    confirmado: p.confirmado,
    invitacion: inv.nombre,
    grupo: inv.grupo || inv.tipo || '',
  })));
  sentados = new Map(asientos.map(a => [K(a.invitado_id, a.persona_idx), a.mesa_id]));
}

const mesaDe = p => sentados.get(K(p.invitado_id, p.idx));
const ocupantes = id => personas.filter(p => mesaDe(p) === id);
const apartadosDe = id => apartados.filter(a => a.mesa_id === id);
const usados = id => ocupantes(id).length + apartadosDe(id).length;

/* ---------- Geometría de cada mesa ----------
   Devuelve el tamaño de la caja, el del cuerpo y dónde va cada lugar,
   en px del salón. Las rectangulares llevan uno en cada cabecera y el
   resto repartido en los dos lados largos, como en el plano.

   Las medidas salen del PDF: una rectangular de 10 mide 151 × 96 px con
   todo y sillas, y las paradas que van en pareja junto a la pista (4 y 10,
   5 y 11) quedan a 144 px una de otra. Por eso sus lugares son un poco más
   chicos y más juntos que los de las redondas: si no, se enciman. */
const FICHA = 28;        // separación entre lugares, redondas
const FICHA_RECT = 22;   // separación entre lugares, rectangulares

function geometria(m) {
  const cap = m.capacidad;
  if (m.forma === 'rect_h' || m.forma === 'rect_v') {
    const cab = cap >= 4 ? 1 : 0;
    const lados = cap - 2 * cab;
    const arriba = Math.ceil(lados / 2), abajo = lados - arriba;
    const largo = Math.max(arriba, 1) * FICHA_RECT + 4;
    const ancho = 34;
    const lugares = [];
    const fila = (n, y) => {
      for (let i = 0; i < n; i++) lugares.push({ x: (i - (n - 1) / 2) * FICHA_RECT, y });
    };
    fila(arriba, -(ancho / 2 + 12));
    if (cab) lugares.push({ x: largo / 2 + 12, y: 0 });
    fila(abajo, ancho / 2 + 12);
    if (cab) lugares.push({ x: -(largo / 2 + 12), y: 0 });
    const vertical = m.forma === 'rect_v';
    const w = largo + 2 * 24, h = ancho + 2 * 24;
    return {
      w: vertical ? h : w, h: vertical ? w : h,
      cw: vertical ? ancho : largo, ch: vertical ? largo : ancho,
      lugares: vertical ? lugares.map(l => ({ x: l.y, y: l.x })) : lugares,
    };
  }
  const radio = Math.max(48, Math.round(cap * FICHA / (2 * Math.PI)) + 2);
  const caja = (radio + 16) * 2;
  const lugares = Array.from({ length: cap }, (_, i) => {
    const ang = -Math.PI / 2 + i * 2 * Math.PI / cap;
    return { x: radio * Math.cos(ang), y: radio * Math.sin(ang) };
  });
  return { w: caja, h: caja, cw: (radio - 17) * 2, ch: (radio - 17) * 2, lugares };
}

/* ---------- Render ---------- */
function render() {
  recalcular();
  renderStats();
  renderPool();
  renderSalon();
  renderBarra();
  renderEditor();
}

function renderStats() {
  const total    = personas.length;
  const conLugar = personas.filter(p => mesaDe(p) != null).length;
  const lugares  = mesas.reduce((a, m) => a + m.capacidad, 0);
  $('#stats').innerHTML = [
    ['Mesas', mesas.length],
    ['Lugares', lugares],
    ['Sentados', conLugar],
    ['Apartados', apartados.length],
    ['Sin lugar', total - conLugar],
    ['Libres', Math.max(lugares - conLugar - apartados.length, 0)],
  ].map(([l, n]) => `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');

  $('#salon-info').textContent = mesas.length
    ? 'Toca una mesa para ver quién va. Arrástrala por el centro para moverla.'
    : 'Todavía no hay mesas.';
}

function renderPool() {
  const q = ($('#q').value || '').trim().toLowerCase();
  const soloConf = $('#solo-conf').checked;

  const grupos = invitados.map(inv => {
    const suyas = personas.filter(p => p.invitado_id === inv.id);
    const libres = suyas.filter(p => mesaDe(p) == null);
    return { inv, suyas, libres };
  }).filter(g => g.libres.length)
    .filter(g => !soloConf || g.inv.asistira === true)
    .filter(g => !q
      || (g.inv.nombre || '').toLowerCase().includes(q)
      || (g.inv.grupo || '').toLowerCase().includes(q)
      || g.libres.some(p => p.nombre.toLowerCase().includes(q)));

  const sinLugar = grupos.reduce((a, g) => a + g.libres.length, 0);
  $('#pool-cuenta').textContent = `· ${sinLugar} persona${sinLugar === 1 ? '' : 's'}`;

  $('#pool-lista').innerHTML = grupos.map(g => {
    const tokGrupo = `g|${g.inv.id}`;
    const pend = g.inv.asistira === true ? '' : ' · sin confirmar';
    return `
      <div class="grupo">
        <div class="grupo-cab">
          <span class="persona grupo-nombre ${sel === tokGrupo ? 'elegida' : ''}"
                draggable="true" data-persona="${tokGrupo}"
                title="Sentar a toda la invitación">${escapeHtml(g.inv.nombre)}</span>
          <span class="grupo-meta">${g.libres.length}/${g.suyas.length}${pend}</span>
        </div>
        ${g.inv.grupo ? `<div class="grupo-meta">${escapeHtml(g.inv.grupo)}</div>` : ''}
        <div class="grupo-gente">
          ${g.libres.map(p => {
            const tok = `p|${p.invitado_id}|${p.idx}`;
            return `<span class="persona ${p.confirmado ? '' : 'sin-confirmar'} ${sel === tok ? 'elegida' : ''}"
                          draggable="true" data-persona="${tok}"
                          title="${escapeHtml(p.nombre)}${p.restriccion ? ' · ' + escapeHtml(p.restriccion) : ''}"
                    >${escapeHtml(p.nombre)}</span>`;
          }).join('')}
        </div>
      </div>`;
  }).join('') || `<p class="muted" style="padding:0.8rem 0">Ya todos tienen lugar.</p>`;
}

function renderSalon() {
  $('#salon').innerHTML = htmlSalon();
  aplicarZoom();
}

/* El salón como HTML. Para imprimir va "limpio": sin la persona elegida
   ni la mesa abierta, que solo tienen sentido en pantalla. */
function htmlSalon(limpio = false) {
  const elegido = limpio ? null : sel;
  const abierta = limpio ? null : editando;
  const fijos = ELEMENTOS.map(e => `
    <div class="elemento ${e.cls}" data-elemento="${e.cls}"
         title="${limpio ? '' : 'Toca para cambiar el texto'}"
         style="left:${e.x * 100}%;top:${e.y * 100}%;width:${e.w * 100}%;height:${e.h * 100}%"
    >${escapeHtml(textoDe(e))}</div>`).join('');

  const html = mesas.map(m => {
    const g = geometria(m);
    const gente = ocupantes(m.id);
    const aps = apartadosDe(m.id);
    const llena = gente.length + aps.length >= m.capacidad;

    const fichas = g.lugares.map((l, i) => {
      const pos = `left:${(g.w / 2 + l.x).toFixed(1)}px;top:${(g.h / 2 + l.y).toFixed(1)}px`;
      const p = gente[i];
      if (p) {
        const tok = `p|${p.invitado_id}|${p.idx}`;
        const cls = [
          'asiento',
          p.restriccion ? 'con-restriccion' : '',
          p.confirmado ? '' : 'sin-confirmar',
          elegido === tok ? 'elegida' : '',
        ].filter(Boolean).join(' ');
        return `<div class="${cls}" style="${pos}" draggable="true" data-persona="${tok}"
                     title="${escapeHtml(p.nombre)} · ${escapeHtml(p.invitacion)}${p.restriccion ? ' · ' + escapeHtml(p.restriccion) : ''}"
                >${escapeHtml(iniciales(p.nombre))}</div>`;
      }
      const a = aps[i - gente.length];
      if (a) {
        const tok = `a|${a.id}`;
        return `<div class="asiento apartado ${elegido === tok ? 'elegida' : ''}" style="${pos}"
                     draggable="true" data-persona="${tok}"
                     title="${escapeHtml(a.nombre)} · apartado, pendiente"
                >${escapeHtml(iniciales(a.nombre))}</div>`;
      }
      return `<div class="asiento libre" style="${pos}"></div>`;
    }).join('');

    return `
      <div class="mesa ${m.forma} ${llena ? 'llena' : ''} ${abierta === m.id ? 'abierta' : ''}"
           data-mesa="${m.id}"
           style="left:${(m.pos_x * 100).toFixed(2)}%;top:${(m.pos_y * 100).toFixed(2)}%;--w:${g.w}px;--h:${g.h}px;--cw:${g.cw}px;--ch:${g.ch}px"
           title="${m.nombre ? escapeHtml(m.nombre) : 'Mesa ' + m.id}">
        <div class="mesa-cuerpo">
          <div class="mesa-num">${m.id}</div>
          <div class="mesa-cuenta">${gente.length + aps.length}/${m.capacidad}</div>
        </div>
        ${fichas}
      </div>`;
  }).join('');

  return fijos + html;
}

/* ---------- Zoom ----------
   Ajustado, el salón entra completo a lo ancho. En el teléfono eso lo deja
   ilegible, así que ahí no baja de la mitad y se recorre con scroll. */
function zoomAjustado() {
  const ajuste = ($('#lienzo').clientWidth - 2) / SALON_W;
  return ajuste < 0.3 ? 0.5 : ajuste;
}

function aplicarZoom() {
  const z = zoom ?? zoomAjustado();
  $('#salon').style.transform = `scale(${z})`;
  $('#marco').style.width  = (SALON_W * z) + 'px';
  $('#marco').style.height = (SALON_H * z) + 'px';
}

function cambiarZoom(f) {
  const z = (zoom ?? zoomAjustado()) * f;
  zoom = Math.min(2, Math.max(0.2, z));
  aplicarZoom();
}

function renderBarra() {
  const barra = $('#barra');
  barra.classList.toggle('hidden', !sel);
  if (!sel) return;

  const p = sel.split('|');
  let texto, sentada = false, quitar = 'Quitar de la mesa';
  if (p[0] === 'g') {
    const inv = invitados.find(x => x.id === p[1]);
    texto = `${inv ? inv.nombre : ''} · toca una mesa para sentar a toda la invitación`;
    sentada = personas.some(x => x.invitado_id === p[1] && mesaDe(x) != null);
  } else if (p[0] === 'a') {
    const a = apartados.find(x => x.id === +p[1]);
    texto = `${a ? a.nombre : ''} (apartado) · toca otra mesa para pasarle el lugar`;
    sentada = true;
    quitar = 'Quitar apartado';
  } else {
    const per = personas.find(x => x.invitado_id === p[1] && x.idx === +p[2]);
    texto = `${per ? per.nombre : ''} · toca una mesa para darle lugar`;
    sentada = per ? mesaDe(per) != null : false;
  }
  $('#barra-texto').textContent = texto;
  $('#btn-quitar').textContent = quitar;
  $('#btn-quitar').classList.toggle('hidden', !sentada);
}

function renderEditor() {
  const card = $('#editor');
  const m = mesas.find(x => x.id === editando);
  card.classList.toggle('hidden', !m);
  if (!m) return;
  $('#ed-num').textContent = m.id + (m.nombre ? ' · ' + m.nombre : '')
    + ` · ${usados(m.id)}/${m.capacidad}`;
  // No pisar lo que se esté escribiendo cuando otro cambio vuelve a pintar.
  if (document.activeElement !== $('#ed-nombre')) $('#ed-nombre').value = m.nombre || '';
  if (document.activeElement !== $('#ed-cap')) $('#ed-cap').value = m.capacidad;
  $('#ed-forma').value = m.forma || 'redonda';

  const gente = ocupantes(m.id).map(p => `
    <li>
      <span class="quien">${escapeHtml(p.nombre)}
        <span class="de">${escapeHtml(p.invitacion)}${p.confirmado ? '' : ' · sin confirmar'}${p.restriccion ? ' · ' + escapeHtml(p.restriccion) : ''}</span>
      </span>
      <button class="small" data-quitar="p|${p.invitado_id}|${p.idx}">Quitar</button>
    </li>`);
  const aps = apartadosDe(m.id).map(a => `
    <li>
      <span class="quien pend">${escapeHtml(a.nombre)}
        <span class="de">Apartado · pendiente de invitación</span>
      </span>
      <button class="small" data-quitar="a|${a.id}">Quitar</button>
    </li>`);
  const filas = [...gente, ...aps]
    .map((li, i) => li.replace('<li>', `<li><span class="n">${i + 1}</span>`));
  $('#ed-lugares').innerHTML = filas.join('')
    || `<li class="muted">Nadie todavía.</li>`;

  const antes = $('#ed-destino').value;
  $('#ed-destino').innerHTML = mesas.filter(x => x.id !== m.id).map(x => {
    const n = usados(x.id);
    return `<option value="${x.id}">Mesa ${x.id}${x.nombre ? ' · ' + escapeHtml(x.nombre) : ''} · ${n ? n + '/' + x.capacidad : 'vacía'}</option>`;
  }).join('');
  if (antes && +antes !== m.id) $('#ed-destino').value = antes;
}

/* ---------- Guardar ---------- */
async function cargar() {
  const d = await rpc('admin_mesas_datos', { p_clave: clave });
  mesas = d.mesas || [];
  invitados = d.invitados || [];
  asientos = d.asientos || [];
  apartados = d.apartados || [];
  // Si la base todavía no tiene la 017, se quedan los textos por defecto.
  etiquetas = await rpc('admin_salon_etiqueta', { p_clave: clave }).catch(() => ({})) || {};
  render();
}

async function editarElemento(cls) {
  const e = ELEMENTOS.find(x => x.cls === cls);
  if (!e) return;
  const nuevo = prompt('Texto para este espacio del salón (vacío = sin nombre):', textoDe(e));
  if (nuevo === null) return;
  try {
    etiquetas = await rpc('admin_salon_etiqueta', {
      p_clave: clave, p_elemento: cls, p_texto: nuevo.trim().slice(0, 40),
    });
    render();
  } catch (err) { alert(err.message); }
}

/* Cada movimiento se guarda al momento. No hay botón de guardar: armar el
   salón son cientos de movimientos pequeños y nadie se acuerda de apretarlo. */
async function sentar(invId, idx, mesaId) {
  try {
    await rpc('admin_sentar', {
      p_clave: clave, p_invitado_id: invId, p_persona_idx: idx, p_mesa_id: mesaId,
    });
    asientos = asientos.filter(a => !(a.invitado_id === invId && a.persona_idx === idx));
    if (mesaId != null) asientos.push({ invitado_id: invId, persona_idx: idx, mesa_id: mesaId });
    render();
  } catch (e) { alert(e.message); }
}

async function sentarGrupo(invId, mesaId) {
  try {
    const r = await rpc('admin_sentar_grupo', {
      p_clave: clave, p_invitado_id: invId, p_mesa_id: mesaId,
    });
    if (r && r.faltaron > 0) {
      alert(`La mesa se llenó: ${r.faltaron} persona${r.faltaron === 1 ? '' : 's'} de esa invitación quedaron sin lugar.`);
    }
    await cargar();
  } catch (e) { alert(e.message); }
}

async function levantarGrupo(invId) {
  try {
    await rpc('admin_levantar_grupo', { p_clave: clave, p_invitado_id: invId });
    await cargar();
  } catch (e) { alert(e.message); }
}

async function apartar(mesaId, nombre) {
  const a = await rpc('admin_apartar', { p_clave: clave, p_mesa_id: mesaId, p_nombre: nombre });
  apartados.push(a);
  render();
}

async function quitarApartado(id, preguntar = true) {
  const a = apartados.find(x => x.id === id);
  if (!a) return;
  if (preguntar && !confirm(`¿Quitar el lugar apartado para ${a.nombre}?`)) return;
  try {
    await rpc('admin_apartado_borrar', { p_clave: clave, p_id: id });
    apartados = apartados.filter(x => x.id !== id);
    render();
  } catch (e) { alert(e.message); }
}

/* Un apartado no tiene invitación detrás: pasarlo a otra mesa es apartar
   allá con el mismo nombre y soltar el de acá. */
async function moverApartado(id, mesaId) {
  const a = apartados.find(x => x.id === id);
  if (!a || a.mesa_id === mesaId) return;
  try {
    await apartar(mesaId, a.nombre);
    await quitarApartado(id, false);
  } catch (e) { alert(e.message); }
}

async function moverMesa(id, x, y) {
  try {
    await rpc('admin_mesa_guardar', { p_clave: clave, p_id: id, p_pos_x: x, p_pos_y: y });
    const m = mesas.find(v => v.id === id);
    if (m) { m.pos_x = x; m.pos_y = y; }
  } catch (e) { alert(e.message); cargar(); }
}

async function agregarMesa() {
  // Abajo, en el espacio libre junto al pastel, en fila para que no se apilen.
  const n = mesas.length;
  const x = 0.06 + (n % 10) * 0.098;
  const y = 0.93;
  try {
    const m = await rpc('admin_mesa_guardar', {
      p_clave: clave, p_pos_x: x, p_pos_y: y, p_forma: $('#nueva-forma').value,
    });
    mesas.push(m);
    editando = m.id;
    render();
  } catch (e) { alert(e.message); }
}

/* ---------- Autoacomodar ----------
   Sienta de un jalón a quienes todavía no tienen lugar, juntando por tipo
   de invitado: familia de la novia con familia de la novia, cortejo con
   cortejo, amigos del papá con amigos del papá. A nadie que ya esté
   sentado se le mueve, ni se tocan los apartados: solo se llenan huecos.
   Respeta "Solo los que ya confirmaron".

   Por cada invitación busca, en este orden:
     1. una mesa de su mismo grupo donde quepa entera
     2. una mesa vacía
     3. cualquier mesa donde quepa entera
     4. si no cabe junta en ninguna, se parte entre las que tengan lugar,
        primero las de su grupo
   Los grupos grandes van primero, para que les toquen mesas enteras. */
const grupoDe = inv => inv.tipo === 'cortejo' ? 'Cortejo' : (inv.grupo || inv.tipo || 'Otros');

function planAutoacomodo() {
  const soloConf = $('#solo-conf').checked;
  const libres = new Map(mesas.map(m => [m.id, m.capacidad - usados(m.id)]));
  const gruposEn = new Map(mesas.map(m => [m.id, new Set(ocupantes(m.id).map(p =>
    grupoDe(invitados.find(i => i.id === p.invitado_id) || {})))]));

  const porGrupo = new Map();
  invitados
    .filter(inv => !soloConf || inv.asistira === true)
    .forEach(inv => {
      const sueltas = personas.filter(p => p.invitado_id === inv.id && mesaDe(p) == null);
      if (!sueltas.length) return;
      const g = grupoDe(inv);
      if (!porGrupo.has(g)) porGrupo.set(g, []);
      porGrupo.get(g).push({ inv, sueltas });
    });

  const grupos = [...porGrupo.entries()]
    .map(([g, invs]) => ({ g, invs: invs.sort((a, b) => b.sueltas.length - a.sueltas.length) }))
    .sort((a, b) => b.invs.reduce((s, x) => s + x.sueltas.length, 0) - a.invs.reduce((s, x) => s + x.sueltas.length, 0));

  const ids = mesas.map(m => m.id).sort((a, b) => a - b);
  const plan = [];   // { mesaId, gente: [persona] }
  let sinLugar = 0;

  const sentarEn = (id, gente, g) => {
    plan.push({ mesaId: id, gente });
    libres.set(id, libres.get(id) - gente.length);
    gruposEn.get(id).add(g);
  };

  for (const { g, invs } of grupos) {
    for (const { sueltas } of invs) {
      const n = sueltas.length;
      const suya  = ids.find(id => libres.get(id) >= n && gruposEn.get(id).has(g));
      const vacia = ids.find(id => libres.get(id) >= n && !gruposEn.get(id).size && usados(id) === 0);
      const otra  = ids.find(id => libres.get(id) >= n);
      const destino = suya ?? vacia ?? otra;
      if (destino != null) { sentarEn(destino, sueltas, g); continue; }

      // No cabe junta en ninguna: se reparte, primero en mesas de su grupo.
      let resto = [...sueltas];
      const orden = [...ids].sort((a, b) => (gruposEn.get(b).has(g) ? 1 : 0) - (gruposEn.get(a).has(g) ? 1 : 0));
      for (const id of orden) {
        if (!resto.length) break;
        const k = Math.min(libres.get(id), resto.length);
        if (k > 0) { sentarEn(id, resto.slice(0, k), g); resto = resto.slice(k); }
      }
      sinLugar += resto.length;
    }
  }
  return { plan, sinLugar };
}

async function autoacomodar() {
  const { plan, sinLugar } = planAutoacomodo();
  const personasPlan = plan.reduce((s, x) => s + x.gente.length, 0);
  if (!personasPlan) return alert('No hay a quién acomodar: o ya todos tienen lugar o no queda espacio en las mesas.');
  const mesasUsadas = new Set(plan.map(x => x.mesaId)).size;
  const soloConf = $('#solo-conf').checked;
  if (!confirm(`Se van a sentar ${personasPlan} persona${personasPlan === 1 ? '' : 's'}`
    + `${soloConf ? ' (solo confirmados)' : ''} en ${mesasUsadas} mesa${mesasUsadas === 1 ? '' : 's'}, juntando por tipo de invitado.`
    + ` A quien ya tiene lugar no se le mueve.`
    + (sinLugar ? `\n\n${sinLugar} no caben: faltan lugares.` : '')
    + '\n\n¿Seguir?')) return;

  const boton = $('#btn-auto');
  boton.disabled = true;
  let hechos = 0;
  const errores = [];
  for (const { mesaId, gente } of plan) {
    for (const p of gente) {
      boton.textContent = `Acomodando… ${++hechos}/${personasPlan}`;
      try {
        await rpc('admin_sentar', {
          p_clave: clave, p_invitado_id: p.invitado_id, p_persona_idx: p.idx, p_mesa_id: mesaId,
        });
      } catch (e) { errores.push(`${p.nombre}: ${e.message}`); }
    }
  }
  boton.disabled = false;
  boton.textContent = 'Autoacomodar';
  await cargar();
  if (errores.length) alert(`No se pudo sentar a ${errores.length}:\n` + errores.slice(0, 10).join('\n'));
}

/* ---------- Qué hacer con lo elegido ---------- */
function aplicar(tok, mesaId) {
  const p = String(tok || '').split('|');
  if (p[0] === 'p') return sentar(p[1], +p[2], mesaId);
  if (p[0] === 'g') return mesaId == null ? levantarGrupo(p[1]) : sentarGrupo(p[1], mesaId);
  if (p[0] === 'a') return mesaId == null ? quitarApartado(+p[1]) : moverApartado(+p[1], mesaId);
}

function elegir(tok) {
  sel = (sel === tok) ? null : tok;
  render();
}

function abrirMesa(id) {
  editando = id;
  render();
  $('#editor').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function tocarMesa(id) {
  if (!sel) return abrirMesa(id);
  const tok = sel;
  sel = null;
  aplicar(tok, id);
}

/* ---------- Arrastrar y soltar ---------- */
document.addEventListener('dragstart', e => {
  const el = e.target.closest('[data-persona]');
  if (!el) return;
  e.dataTransfer.setData('text/plain', el.dataset.persona);
  e.dataTransfer.effectAllowed = 'move';
});

function limpiarDestinos() {
  $$('.mesa.destino').forEach(m => m.classList.remove('destino'));
}
document.addEventListener('dragend', limpiarDestinos);

const salon = $('#salon');
salon.addEventListener('dragover', e => {
  const m = e.target.closest('.mesa');
  if (!m) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  if (!m.classList.contains('destino')) { limpiarDestinos(); m.classList.add('destino'); }
});
salon.addEventListener('drop', e => {
  const m = e.target.closest('.mesa');
  if (!m) return;
  e.preventDefault();
  limpiarDestinos();
  aplicar(e.dataTransfer.getData('text/plain'), +m.dataset.mesa);
});

// Soltar de vuelta en la lista = quitar de la mesa.
const pool = $('#pool');
pool.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
pool.addEventListener('drop', e => {
  e.preventDefault();
  aplicar(e.dataTransfer.getData('text/plain'), null);
});

/* ---------- Mover las mesas por el salón ----------
   El mismo gesto sirve para dos cosas: si el dedo no se movió es un toque
   (sienta a quien esté elegido, o abre la mesa); si se movió, es arrastrar
   la mesa. El rectángulo del salón ya viene escalado por el zoom, así que
   la fracción sale bien a cualquier tamaño. */
let arrastre = null;
salon.addEventListener('pointerdown', e => {
  const c = e.target.closest('.mesa-cuerpo');
  if (!c) return;
  const el = c.closest('.mesa');
  arrastre = { id: +el.dataset.mesa, el, x0: e.clientX, y0: e.clientY, movido: false, pos: null };
  c.setPointerCapture(e.pointerId);
});
salon.addEventListener('pointermove', e => {
  if (!arrastre) return;
  if (!arrastre.movido && Math.hypot(e.clientX - arrastre.x0, e.clientY - arrastre.y0) < 5) return;
  arrastre.movido = true;
  const r = salon.getBoundingClientRect();
  const x = Math.min(0.98, Math.max(0.02, (e.clientX - r.left) / r.width));
  const y = Math.min(0.98, Math.max(0.02, (e.clientY - r.top) / r.height));
  arrastre.el.style.left = (x * 100).toFixed(2) + '%';
  arrastre.el.style.top  = (y * 100).toFixed(2) + '%';
  arrastre.pos = { x, y };
});
function soltarMesa() {
  if (!arrastre) return;
  const a = arrastre;
  arrastre = null;
  if (a.movido && a.pos) moverMesa(a.id, a.pos.x, a.pos.y);
  else tocarMesa(a.id);
}
salon.addEventListener('pointerup', soltarMesa);
salon.addEventListener('pointercancel', () => { arrastre = null; cargar(); });

/* ---------- Clics ---------- */
salon.addEventListener('click', e => {
  const per = e.target.closest('[data-persona]');
  if (per) return elegir(per.dataset.persona);
  const el = e.target.closest('[data-elemento]');
  if (el) editarElemento(el.dataset.elemento);
});
pool.addEventListener('click', e => {
  const per = e.target.closest('[data-persona]');
  if (per) elegir(per.dataset.persona);
});

$('#btn-cancelar').addEventListener('click', () => { sel = null; render(); });
$('#btn-quitar').addEventListener('click', () => {
  const tok = sel;
  sel = null;
  aplicar(tok, null);
});

$('#btn-mesa').addEventListener('click', agregarMesa);
$('#btn-auto').addEventListener('click', autoacomodar);

$('#solo-conf').addEventListener('change', renderPool);

$('#zoom-mas').addEventListener('click', () => cambiarZoom(1.25));
$('#zoom-menos').addEventListener('click', () => cambiarZoom(0.8));

window.addEventListener('resize', () => { if (zoom == null) aplicarZoom(); });

/* ---------- Panel de la mesa ---------- */
const mesaAbierta = () => mesas.find(x => x.id === editando);

$('#ed-cerrar').addEventListener('click', () => { editando = null; render(); });
$('#ed-guardar').addEventListener('click', async () => {
  const m = mesaAbierta();
  if (!m) return;
  try {
    const nueva = await rpc('admin_mesa_guardar', {
      p_clave: clave, p_id: m.id,
      p_nombre: $('#ed-nombre').value,
      p_capacidad: Math.max(1, Math.min(24, +$('#ed-cap').value || m.capacidad)),
      p_forma: $('#ed-forma').value,
    });
    Object.assign(m, nueva);
    render();
  } catch (e) { alert(e.message); }
});

$('#ed-lugares').addEventListener('click', e => {
  const b = e.target.closest('[data-quitar]');
  if (b) aplicar(b.dataset.quitar, null);
});

async function apartarDesdePanel() {
  const m = mesaAbierta();
  const nombre = $('#ed-apartar-nombre').value.trim();
  if (!m || !nombre) return;
  try {
    await apartar(m.id, nombre);
    $('#ed-apartar-nombre').value = '';
  } catch (e) { alert(e.message); }
}
$('#ed-apartar').addEventListener('click', apartarDesdePanel);
$('#ed-apartar-nombre').addEventListener('keydown', e => { if (e.key === 'Enter') apartarDesdePanel(); });

/* Pasar la mesa completa: si la otra ya tiene gente, se cambian entre sí.
   La forma da igual; solo importa que quepan. */
$('#ed-pasar').addEventListener('click', async () => {
  const m = mesaAbierta();
  const destino = +$('#ed-destino').value;
  const d = mesas.find(x => x.id === destino);
  if (!m || !d) return;
  const aqui = usados(m.id), alla = usados(d.id);
  if (!aqui && !alla) return alert('Las dos mesas están vacías.');
  const aviso = alla
    ? `La mesa ${d.id} ya tiene ${alla}. Se cambian: los ${aqui} de la ${m.id} pasan a la ${d.id} y los ${alla} de la ${d.id} pasan a la ${m.id}. ¿Seguir?`
    : `¿Pasar a las ${aqui} personas de la mesa ${m.id} a la mesa ${d.id}?`;
  if (!confirm(aviso)) return;
  try {
    await rpc('admin_mesa_intercambiar', { p_clave: clave, p_a: m.id, p_b: d.id });
    editando = d.id;
    await cargar();
  } catch (e) { alert(e.message); }
});

$('#ed-vaciar').addEventListener('click', async () => {
  const m = mesaAbierta();
  if (!m) return;
  const gente = ocupantes(m.id);
  const aps = apartadosDe(m.id);
  if (!gente.length && !aps.length) return;
  if (!confirm(`¿Vaciar la mesa ${m.id}? ${gente.length} persona${gente.length === 1 ? '' : 's'} vuelven a "Sin lugar"`
    + (aps.length ? ` y se borran ${aps.length} apartado${aps.length === 1 ? '' : 's'}.` : '.'))) return;
  for (const p of gente) {
    await rpc('admin_sentar', {
      p_clave: clave, p_invitado_id: p.invitado_id, p_persona_idx: p.idx, p_mesa_id: null,
    }).catch(e => alert(e.message));
  }
  for (const a of aps) {
    await rpc('admin_apartado_borrar', { p_clave: clave, p_id: a.id }).catch(e => alert(e.message));
  }
  await cargar();
});
$('#ed-borrar').addEventListener('click', async () => {
  const m = mesaAbierta();
  if (!m) return;
  const gente = usados(m.id);
  const aviso = gente
    ? `La mesa ${m.id} tiene ${gente} lugar${gente === 1 ? '' : 'es'} ocupado${gente === 1 ? '' : 's'}. La gente vuelve a quedar sin lugar y los apartados se borran. ¿Eliminarla?`
    : `¿Eliminar la mesa ${m.id}?`;
  if (!confirm(aviso)) return;
  try {
    await rpc('admin_mesa_borrar', { p_clave: clave, p_id: m.id });
    editando = null;
    await cargar();
  } catch (e) { alert(e.message); }
});

/* ---------- Export ---------- */
function exportar() {
  const filas = [];
  mesas.forEach(m => {
    const gente = ocupantes(m.id);
    gente.forEach((p, i) => filas.push([
      m.id, m.nombre || '', i + 1, p.nombre, p.restriccion || '',
      p.invitacion, p.grupo, p.confirmado ? 'Sí' : 'Sin confirmar',
    ]));
    apartadosDe(m.id).forEach((a, i) => filas.push([
      m.id, m.nombre || '', gente.length + i + 1, a.nombre, '',
      '', '', 'Pendiente',
    ]));
  });
  // Los que todavía no tienen lugar van al final, para que no se olviden.
  personas.filter(p => mesaDe(p) == null).forEach(p => filas.push([
    '', 'Sin mesa', '', p.nombre, p.restriccion || '',
    p.invitacion, p.grupo, p.confirmado ? 'Sí' : 'Sin confirmar',
  ]));

  const sentadas = personas.filter(p => mesaDe(p) != null).length;

  // Segunda hoja: una fila por mesa, para ver de un vistazo cómo va cada una.
  const FORMAS = { redonda: 'Redonda', rect_h: 'Rectangular', rect_v: 'Rectangular' };
  const resumen = mesas.map(m => {
    const gente = ocupantes(m.id), aps = apartadosDe(m.id);
    return [
      m.id, m.nombre || '', FORMAS[m.forma] || '', m.capacidad,
      gente.length, aps.length, Math.max(m.capacidad - gente.length - aps.length, 0),
      [...gente.map(p => p.nombre), ...aps.map(a => a.nombre + ' (pendiente)')].join(' · '),
    ];
  });

  descargarExcel('Mesas · Valeria y Apolo.xlsx', [{
    nombre: 'Mesas',
    titulo: 'Valeria & Apolo · 7 de noviembre de 2026',
    subtitulo: `${mesas.length} mesas · ${sentadas} personas con lugar · ${apartados.length} apartados · ${hoyLargo()}`,
    columnas: [
      { titulo: 'Mesa',        ancho: 8,  centrado: true },
      { titulo: 'Nombre',      ancho: 20 },
      { titulo: 'Lugar',       ancho: 7,  centrado: true },
      { titulo: 'Persona',     ancho: 30 },
      { titulo: 'Restricción', ancho: 26 },
      { titulo: 'Invitación',  ancho: 28 },
      { titulo: 'Grupo',       ancho: 20 },
      { titulo: 'Confirmado',  ancho: 14, centrado: true },
    ],
    filas,
    // Las restricciones resaltadas: es lo que hay que pasarle al catering.
    resaltar: (fila, i) => i === 4 && !!fila[4],
  }, {
    nombre: 'Por mesa',
    titulo: 'Valeria & Apolo · mesas',
    subtitulo: `${mesas.length} mesas · ${sentadas} sentados · ${apartados.length} apartados · ${hoyLargo()}`,
    columnas: [
      { titulo: 'Mesa',      ancho: 7,  centrado: true },
      { titulo: 'Nombre',    ancho: 16 },
      { titulo: 'Forma',     ancho: 13 },
      { titulo: 'Lugares',   ancho: 9,  centrado: true },
      { titulo: 'Sentados',  ancho: 10, centrado: true },
      { titulo: 'Apartados', ancho: 11, centrado: true },
      { titulo: 'Libres',    ancho: 8,  centrado: true },
      { titulo: 'Quiénes',   ancho: 120 },
    ],
    filas: resumen,
    resaltar: (fila, i) => i === 5 && fila[5] > 0,
  }]);
}

/* ---------- PDF ----------
   No se genera un PDF a mano: se arma una vista para imprimir y el
   navegador la guarda como PDF ("Guardar como PDF" en el diálogo de
   imprimir). Primera hoja, el plano del salón; después, la lista de cada
   mesa con nombres completos, que es lo que se le entrega a la finca. */
function imprimir() {
  const sentadas = personas.filter(p => mesaDe(p) != null).length;
  const conGente = mesas.filter(m => usados(m.id));
  const vacias = mesas.length - conGente.length;

  const tarjetas = conGente.map(m => {
    const gente = ocupantes(m.id).map(p => `
      <li>${escapeHtml(p.nombre)}${p.restriccion ? ` <span class="restr">${escapeHtml(p.restriccion)}</span>` : ''}</li>`);
    const aps = apartadosDe(m.id).map(a => `
      <li class="pend">${escapeHtml(a.nombre)} <span>(pendiente)</span></li>`);
    return `
      <div class="tarjeta">
        <h3>Mesa ${m.id}${m.nombre ? ` · ${escapeHtml(m.nombre)}` : ''}
          <span>${usados(m.id)}/${m.capacidad}</span></h3>
        <ol>${[...gente, ...aps].join('')}</ol>
      </div>`;
  }).join('');

  $('#imprimir').innerHTML = `
    <section class="hoja-plano">
      <div class="imp-cab">
        <h1>Valeria &amp; Apolo · Plano del salón</h1>
        <p>${mesas.length} mesas · ${sentadas} sentados · ${apartados.length} apartados · ${hoyLargo()}</p>
      </div>
      <div class="plano-marco"><div class="salon salon-impreso">${htmlSalon(true)}</div></div>
    </section>
    <section class="hoja-lista">
      <div class="imp-cab">
        <h1>Lista por mesa</h1>
        <p>${conGente.length} mesas con gente${vacias ? ` · ${vacias} vacías` : ''} · "(pendiente)" es un lugar apartado sin invitación</p>
      </div>
      <div class="tarjetas">${tarjetas || '<p>Todavía no hay nadie sentado.</p>'}</div>
    </section>`;
  window.print();
}
